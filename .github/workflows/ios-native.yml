name: iOS native build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "modules/**"
      - "package*.json"
      - "app.json"
      - ".github/workflows/ios-native.yml"
  pull_request:
    paths:
      - "modules/**"
      - "package*.json"
      - "app.json"
      - ".github/workflows/ios-native.yml"
permissions:
  contents: read
concurrency:
  group: ios-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx expo prebuild --platform ios --no-install
      - run: pod install --project-directory=ios
      - name: Compile app and Kakao native module
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/DALRO.xcworkspace \
            -scheme DALRO \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/dalro-build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee /tmp/dalro-ios-build.log | xcbeautify --renderer github-actions
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-native-build-log
          path: /tmp/dalro-ios-build.log
          if-no-files-found: ignore
          retention-days: 7
